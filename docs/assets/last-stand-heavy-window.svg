<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="title desc">
  <title id="title">Last Stand heavy-window frame time by configuration</title>
  <desc id="desc">Mean frame time in the 481-frame, 1,000-unit heavy window: 46.9 ms with native Direct3D 8 on the Intel iGPU, 36.8 ms with the d3d8to9 wrapper on the GTX 1650 Ti, 30.1 ms with the 66 percent ally congestion price, and 29.0 ms with the visual trades added. Lower is better; the 30 FPS budget is 33.3 ms.</desc>
  <rect width="920" height="380" fill="#ffffff"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#1f2937">
    <text x="28" y="34" font-size="19" font-weight="600">Last Stand heavy window: 1,000 units, 1920×1080</text>
    <text x="28" y="55" font-size="12.5" fill="#4b5563">481-frame mean frame time · lower is better · 30 FPS budget = 33.3 ms</text>

    <!-- grid and axis -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="280" y1="78" x2="280" y2="318"/>
      <line x1="390" y1="78" x2="390" y2="318"/>
      <line x1="500" y1="78" x2="500" y2="318"/>
      <line x1="610" y1="78" x2="610" y2="318"/>
      <line x1="720" y1="78" x2="720" y2="318"/>
      <line x1="830" y1="78" x2="830" y2="318"/>
    </g>
    <g font-size="11" fill="#6b7280" text-anchor="middle">
      <text x="280" y="336">0</text>
      <text x="390" y="336">10</text>
      <text x="500" y="336">20</text>
      <text x="610" y="336">30</text>
      <text x="720" y="336">40</text>
      <text x="830" y="336">50 ms</text>
    </g>

    <!-- 30 FPS budget -->
    <line x1="646" y1="72" x2="646" y2="318" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="652" y="88" font-size="11.5" fill="#dc2626" font-weight="600">30 FPS budget</text>

    <!-- rows -->
    <g font-size="13">
      <text x="28" y="116" font-weight="500">Native D3D8 · Intel iGPU</text>
      <text x="28" y="132" font-size="10.5" fill="#6b7280">full visuals</text>
      <rect x="280" y="100" width="516" height="30" rx="4" fill="#94a3b8"/>
      <text x="804" y="120" font-size="12.5" font-weight="600">46.9 ms · 21.3 FPS</text>

      <text x="28" y="176" font-weight="500">d3d8to9 · GTX 1650 Ti</text>
      <text x="28" y="192" font-size="10.5" fill="#6b7280">full visuals</text>
      <rect x="280" y="160" width="405" height="30" rx="4" fill="#3b82f6"/>
      <text x="693" y="180" font-size="12.5" font-weight="600">36.8 ms · 27.2 FPS</text>

      <text x="28" y="236" font-weight="500">+ ally congestion price 66%</text>
      <text x="28" y="252" font-size="10.5" fill="#6b7280">gameplay trade</text>
      <rect x="280" y="220" width="331" height="30" rx="4" fill="#f59e0b"/>
      <text x="619" y="240" font-size="12.5" font-weight="600">30.1 ms · 33.3 FPS</text>

      <text x="28" y="296" font-weight="500">+ three visual trades</text>
      <text x="28" y="312" font-size="10.5" fill="#6b7280">best measured</text>
      <rect x="280" y="280" width="319" height="30" rx="4" fill="#10b981"/>
      <text x="607" y="300" font-size="12.5" font-weight="600">29.0 ms · 34.5 FPS</text>
    </g>

    <text x="28" y="362" font-size="10.5" fill="#6b7280">Source build, AA off / Low detail, d3d8to9 v1.16.0, one laptop. The 66% and visual-trade rows are opt-in.</text>
  </g>
</svg>
